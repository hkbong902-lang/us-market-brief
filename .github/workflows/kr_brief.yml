name: KR Market Daily Brief

# 트리거는 두 겹이다. 정시성은 로컬 스케줄러가, 최소 보장은 크론이 맡는다.
# (미국편 daily_brief.yml 과 동일한 구조 — 한쪽만 바꾸지 말 것.)
#
# 1) 정시 경로(주 경로): 로컬 PC의 작업 스케줄러가 월~금 20:30 KST 에
#    workflow_dispatch 를 호출한다(scripts/setup-dispatch.ps1). 수동 실행은 대기열을
#    타지 않아 몇 초 안에 시작한다.
#
# 2) 백업 경로: 아래 크론. on.schedule 은 실행 시각을 보장하지 않는다. 이 워크플로의
#    실측은 2026-09-09 에 273분 지연(17:30 예정 → 22:03 도착), 2026-09-10 에는 아예
#    미발화였다. 마감은 못 지키지만 '아무것도 오지 않는 날'은 막는다.
#
# 두 경로가 같은 날 겹치지 않도록, 크론으로 들어온 실행은 아래 guard 스텝에서
# '오늘 이미 성공한 실행이 있는지' 확인하고 있으면 스스로 종료한다.
# ★ 그래서 크론은 반드시 정시 경로보다 '뒤' 시각이어야 한다. 앞에 두면 가드가 볼
#   성공 실행이 아직 없어 무력해지고, 같은 날 브리핑이 두 번 발송된다.
on:
  schedule:
    # UTC 12:30 (월~금) = 한국시간 21:30. 정시 경로(20:30)보다 뒤에 두어, 정시 경로가
    # 성공한 날에는 guard 가 이 실행을 걸러내도록 한다.
    # ★ 20:00 이후여야 한다 (2026-10-25). 네이버 시세는 넥스트레이드 애프터마켓
    #   (15:40~20:00) 동안 실시간 통합 시세라, 그 전에 돌면 KRX 정규장 종가가 아닌
    #   애프터마켓 가격으로 브리핑이 만들어진다. 예전 19:00 슬롯은 이 조건을 어겼다.
    #   실측 지연(최대 243분)이면 다음 날 02:00 경 도착하며, 자정을 넘긴 실행은
    #   main() 의 session_is_current 가 직전 영업일로 받아 준다.
    - cron: "30 12 * * 1-5"
  workflow_dispatch:      # 정시 경로(로컬 스케줄러) 및 수동 테스트
    inputs:
      force_send:
        description: "휴장(주말·공휴일)이어도 직전 마감 세션 브리핑을 강제 발송"
        type: boolean
        default: false
      no_ai:
        description: "해설 생성 없이 수치 요약본만 발송 (Claude API 미사용 = 비용 0)"
        type: boolean
        default: false

jobs:
  send-kr-brief:
    runs-on: ubuntu-latest
    # 2026-09-10 실측 12m26s. 검색을 10회까지 쓰는 구성이라 날에 따라 더 걸린다.
    # 15분이면 여유가 2분 30초뿐이고, 넘기면 브리핑이 통째로 누락된다.
    # ★ 잡 전체는 아래 '20:30 대기' 스텝(최대 5시간 30분)을 덮도록 크게 잡고, 생성 자체의
    #   상한 30분은 Build & send 스텝에 따로 건다.
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read          # 오늘 이미 성공한 실행이 있는지 조회하기 위해 필요
    steps:
      # 백업 크론이 정시 경로와 겹쳐 브리핑을 두 번 보내는 것을 막는다.
      # 수동 실행(workflow_dispatch)은 사람이 의도한 것이므로 거르지 않는다.
      - name: 중복 발송 가드 (크론 실행에만 적용)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # ★ 창을 'UTC 자정 이후' 가 아니라 '최근 12시간' 으로 잡는다 (2026-09-15).
          #   자정 기준은 US 브리핑에서 틀린다. 정시 dispatch 는 07:20 KST = 22:20Z 로
          #   UTC 로는 '전날' 이고, 크론이 조금만 늦어 00:00Z 를 넘겨 발화하면 since 가
          #   새 UTC 날짜로 점프하면서 그 dispatch 성공을 못 본다. 실제로 2026-09-15 에
          #   dispatch(22:20Z)가 성공했는데 크론이 01:45Z 에 발화해 중복 발송됐다.
          #   상대 창은 날짜 경계가 없어 이 실패 모드가 원천적으로 사라진다.
          #   12시간: 정시(-3h20m)와 크론 실측 지연(최대 ~4h30m)을 모두 덮고,
          #   전날 같은 시각(-24h)은 덮지 않는 폭이다.
          #   ★ 상한도 닫는다. 실시간에는 차이가 없지만, 과거 시점을 재현해 점검할 때
          #     열린 상한은 그 이후의 실행까지 세어 재현을 무의미하게 만든다.
          since=$(date -u -d '12 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          until=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          runs=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/kr_brief.yml/runs?per_page=20&status=success&created=${since}..${until}")
          # 자기 자신은 아직 success 가 아니므로 집계에 잡히지 않는다.
          count=$(printf '%s' "$runs" | python3 -c 'import json,sys; print(len(json.load(sys.stdin).get("workflow_runs",[])))')
          echo "최근 12시간(UTC $since ~ $until) 성공한 실행: ${count}건"
          if [ "$count" -gt 0 ]; then
            echo "정시 경로가 이미 브리핑을 보냈습니다 → 백업 크론 실행을 건너뜁니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        id: guard

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      # ★ 15:00~20:30 KST 에 시작한 실행은 20:30 까지 기다린다 (2026-10-25).
      #   브리핑은 KRX 정규장 종가 기준이라 넥스트레이드 애프터마켓(~20:00)이 끝난 뒤에
      #   만들어야 한다. 그런데 로컬 작업 'KR Market Brief Dispatch' 의 트리거는 Windows
      #   암호가 있어야 바꿀 수 있어 17:35 에 남아 있었다. 호출 시각에 기대지 않고 여기서
      #   시각을 보장한다 - 로컬 작업이 20:30 이면 이 스텝은 그냥 지나간다.
      #   15:00 하한: 자정을 넘겨 늦게 발화한 백업 크론(예: 01:30)이 다음 날 20:30 까지
      #   잠들지 않게 한다. force_send(수동 테스트)는 기다리지 않는다.
      - name: 20:30 KST 까지 대기 (애프터마켓 종료 후 KRX 종가 기준)
        if: steps.guard.outputs.skip != 'true' && !inputs.force_send
        timeout-minutes: 335
        run: |
          now=$(date +%s)
          target=$(TZ=Asia/Seoul date -d 'today 20:30' +%s)
          floor=$(TZ=Asia/Seoul date -d 'today 15:00' +%s)
          if [ "$now" -ge "$floor" ] && [ "$now" -lt "$target" ]; then
            w=$((target - now))
            echo "KST $(TZ=Asia/Seoul date +%H:%M) 시작 → 20:30 까지 ${w}초 대기"
            sleep "$w"
          else
            echo "KST $(TZ=Asia/Seoul date +%H:%M) 시작 → 대기 없음"
          fi

      - name: Build & send KR brief
        if: steps.guard.outputs.skip != 'true'
        timeout-minutes: 30
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 수동 실행에서 체크했을 때만 "1". 스케줄 실행에서는 inputs가 없어 항상 "0".
          FORCE_SEND: ${{ inputs.force_send && '1' || '0' }}
          # USE_CLAUDE=0 이면 Claude 를 호출하지 않고 결정론적 수치 브리핑만 보낸다.
          # 비용이 0 이 되고, 머리말에 '수치 요약본' 표시가 붙어 장애와 구별된다.
          #
          # 우선순위: no_ai 입력(1회성) > 저장소 변수 USE_CLAUDE(상시) > '1'(기본).
          # ★ 저장소 변수를 끼운 이유 (2026-09-30): 정시 발송은 로컬 스케줄러가
          #   inputs 없이 dispatch 하고 크론에도 inputs 가 없다. 그래서 inputs 만
          #   보면 정시 경로를 끌 방법이 아예 없었다. 크레딧 소진처럼 '당분간 해설을
          #   끄고 싶은' 상황에서 매 발송이 ⚠️ 장애 머리말을 달고 나가게 된다.
          #   변수는 코드 수정 없이 켜고 끈다:  gh variable set USE_CLAUDE --body 0
          #   되돌릴 때:                        gh variable set USE_CLAUDE --body 1
          #   (변수를 지워도 기본값 '1' 로 돌아간다)
          USE_CLAUDE: ${{ inputs.no_ai && '0' || vars.USE_CLAUDE || '1' }}
          # 종목마다 '왜 움직였는가' 1줄을 붙이는 구성이라 미국편(5회)보다 검색을 더 쓴다.
          # 저장소 변수로 코드 수정 없이 바꾼다:  gh variable set KR_WEB_SEARCH_MAX_USES --body 5
          #   변수를 지우면 기본값 10 으로 돌아간다. 2026-10-25 10회 실측: 입력 153만 토큰,
          #   약 $3.5, 생성 10분 - 비용 대부분은 검색 결과 본문이 맥락에 쌓이는 몫이다.
          KR_WEB_SEARCH_MAX_USES: ${{ vars.KR_WEB_SEARCH_MAX_USES || '10' }}
          # CLAUDE_MODEL: claude-sonnet-5
          # USE_WEB_SEARCH: "1"
        run: python kr_main.py
