name: US Market Daily Brief

# 트리거는 두 겹이다. 정시성은 로컬 스케줄러가, 최소 보장은 크론이 맡는다.
#
# 1) 정시 경로(주 경로): 로컬 PC의 작업 스케줄러가 화~토 07:20 KST 에
#    workflow_dispatch 를 호출한다(scripts/setup-dispatch.ps1). 수동 실행은 대기열을
#    타지 않아 몇 초 안에 시작하므로 08:00 KST 마감을 지킬 수 있다.
#
# 2) 백업 경로: 아래 크론. on.schedule 은 실행 시각을 보장하지 않으며 이 저장소의
#    실측 지연은 117분·128분이었다. 그래서 마감은 못 지키지만 '아무것도 오지 않는 날'은
#    막는다. 한때 이 크론을 지우고 1)만 남겼다가, 로컬 스케줄러가 아직 등록되지 않은
#    상태에서 트리거가 하나도 없어 브리핑이 통째로 누락된 날이 있었다(2026-09-10).
#    검증되지 않은 대체 경로를 위해 작동 중인 경로를 먼저 끊지 않는다.
#
# 두 경로가 같은 날 겹치지 않도록, 크론으로 들어온 실행은 아래 guard 스텝에서
# '오늘 이미 성공한 실행이 있는지' 확인하고 있으면 스스로 종료한다.
on:
  schedule:
    # UTC 23:30 (월~금) = 한국시간 화~토 08:30. 정시 경로(07:20)보다 뒤에 두어,
    # 정시 경로가 성공한 날에는 guard 가 이 실행을 걸러내도록 한다.
    - cron: "30 23 * * 1-5"
  workflow_dispatch:
    inputs:
      force_send:
        description: "휴장(주말·공휴일)이어도 직전 마감 세션 브리핑을 강제 발송"
        type: boolean
        default: false

jobs:
  send-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read          # 오늘 이미 성공한 실행이 있는지 조회하기 위해 필요
    steps:
      # 백업 크론이 정시 경로와 겹쳐 브리핑을 두 번 보내는 것을 막는다.
      # 수동 실행(workflow_dispatch)은 사람이 의도한 것이므로 거르지 않는다.
      - name: 중복 발송 가드 (크론 실행에만 적용)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          since=$(date -u +%Y-%m-%dT00:00:00Z)
          runs=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/daily_brief.yml/runs?per_page=20&status=success&created=>=${since}")
          # 자기 자신은 아직 success 가 아니므로 집계에 잡히지 않는다.
          count=$(printf '%s' "$runs" | python3 -c 'import json,sys; print(len(json.load(sys.stdin).get("workflow_runs",[])))')
          echo "오늘(UTC $since 이후) 성공한 실행: ${count}건"
          if [ "$count" -gt 0 ]; then
            echo "정시 경로가 이미 브리핑을 보냈습니다 → 백업 크론 실행을 건너뜁니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        id: guard

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Build & send brief
        if: steps.guard.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 수동 실행에서 체크했을 때만 "1". 스케줄 실행에서는 inputs가 없어 항상 "0".
          FORCE_SEND: ${{ inputs.force_send && '1' || '0' }}
          # CLAUDE_MODEL: claude-sonnet-5
          # USE_WEB_SEARCH: "1"
          # SKIP_ON_HOLIDAY: "0"
        run: python main.py
