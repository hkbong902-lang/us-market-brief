name: US Market Daily Brief

on:
  schedule:
    # UTC 22:15 (월~금) = 한국시간 화~토 07:15
    # 미국장 마감(16:00 ET)은 겨울(EST) 기준 UTC 21:00이다. 마감 직후에는 yfinance 일봉이
    # 아직 갱신되지 않아 최근 세션이 T-1로 잡히고, 정상 거래일에 "휴장" 안내가 나갈 수 있다.
    # 마감 후 75분 이상 여유를 두어 오탐을 막는다(Actions 크론 자체 지연도 흡수).
    - cron: "15 22 * * 1-5"
  workflow_dispatch: {}   # 수동 실행(테스트용)

jobs:
  send-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build & send brief
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # CLAUDE_MODEL: claude-sonnet-5
          # USE_WEB_SEARCH: "1"
          # SKIP_ON_HOLIDAY: "0"
        run: python main.py
