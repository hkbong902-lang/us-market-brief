name: US Market Daily Brief

# 예약은 GitHub이 하지 않는다.
#
# on.schedule 은 실행 시각을 보장하지 않는다. 이 저장소의 실측에서 지정 시각보다
# 117분·128분 밀렸고, 지연된 실행도 success 로 기록되므로 어디에도 신호가 남지 않는다.
# 브리핑은 08:00 KST 전에 도착해야 하는데, 겨울(EST)에는 미국장 마감(21:00 UTC) 후
# 75분을 기다리면 마감까지 45분밖에 남지 않아 2시간 지연을 흡수할 방법이 없다.
#
# 그래서 정확한 시각은 로컬 PC의 작업 스케줄러가 맡고(scripts/setup-dispatch.ps1),
# 여기서는 workflow_dispatch 로 즉시 실행만 받는다. 수동 실행은 대기열을 타지 않는다.
# 스케줄러는 화~토 07:20 KST 에 호출한다 — 미국장은 월~금이고 마감 후 밤에 브리핑이
# 만들어지므로 한국시간으로는 다음 날 아침이다(금요일 미국장 → 토요일 아침).
on:
  workflow_dispatch:
    inputs:
      force_send:
        description: "휴장(주말·공휴일)이어도 직전 마감 세션 브리핑을 강제 발송"
        type: boolean
        default: false

jobs:
  send-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build & send brief
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 수동 실행에서 체크했을 때만 "1". 스케줄 실행에서는 inputs가 없어 항상 "0".
          FORCE_SEND: ${{ inputs.force_send && '1' || '0' }}
          # CLAUDE_MODEL: claude-sonnet-5
          # USE_WEB_SEARCH: "1"
          # SKIP_ON_HOLIDAY: "0"
        run: python main.py
